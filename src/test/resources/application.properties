spring.jpa.database-platform=org.hibernate.dialect.HSQLDialect
spring.datasource.url=jdbc:hsqldb:mem:test
# Placeholder OAuth client so the security configuration can be built in tests
spring.security.oauth2.client.registration.metawiki.client-id=test-client-id
spring.security.oauth2.client.registration.metawiki.client-secret=test-client-secret
spring.security.oauth2.client.registration.metawiki.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.metawiki.redirect-uri=http://localhost:8080/api/login/oauth2/code/metawiki
spring.security.oauth2.client.provider.metawiki.authorization-uri=https://example.invalid/oauth2/authorize
spring.security.oauth2.client.provider.metawiki.token-uri=https://example.invalid/oauth2/access_token
spring.security.oauth2.client.provider.metawiki.user-info-uri=https://example.invalid/oauth2/resource/profile
spring.security.oauth2.client.provider.metawiki.user-name-attribute=sub
